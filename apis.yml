aid: berkeley-lights

name: Berkeley Lights

description: 'Berkeley Lights is a biotechnology company that develops and commercializes advanced cell analysis platforms, enabling researchers to perform high‑throughput single‑cell assays and functional screening. The firm provides hardware, software, and cloud‑based services to accelerate discovery in therapeutics, genomics, and cell therapy development. Founded in 2015 and based in the San Francisco Bay Area, Berkeley Lights has been recognized for its innovative optofluidic technology and was acquired by Bruker in 2023.'

